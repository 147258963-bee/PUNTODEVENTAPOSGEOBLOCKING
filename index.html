<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEO BLOCKING | ERP CLOUD v11.0</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-oscuro: #0f172a;
            --acento: #00f2fe;
            --tarjeta: #1e293b;
            --texto: #f8fafc;
            --verde: #22c55e;
            --rojo: #ef4444;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg-oscuro); color: var(--texto); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* LOGIN */
        #login-overlay { position: fixed; inset: 0; background: #020617; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--tarjeta); padding: 40px; border-radius: 16px; width: 320px; text-align: center; border: 1px solid var(--acento); }

        /* SIDEBAR */
        #sidebar { width: 260px; background: #020617; padding: 20px; border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .menu-item { padding: 12px; border-radius: 8px; cursor: pointer; color: #94a3b8; margin-bottom: 5px; transition: 0.3s; }
        .menu-item:hover, .menu-item.active { background: #1e293b; color: var(--acento); }

        /* CONTENIDO */
        main { flex: 1; padding: 30px; overflow-y: auto; display: none; }
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* TABLAS Y CARDS */
        .grid-kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .card { background: var(--tarjeta); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        .val { font-size: 1.8rem; font-weight: bold; margin-top: 10px; color: var(--acento); }

        input { background: #020617; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        button { padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-main { background: var(--acento); color: #020617; }
        .btn-sell { background: var(--verde); color: white; height: 60px; font-size: 1.2rem; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; padding: 12px; color: #94a3b8; border-bottom: 2px solid #334155; }
        td { padding: 12px; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h2 style="color: var(--acento)">GEO BLOCKING</h2>
            <input type="text" id="user" placeholder="Usuario">
            <input type="password" id="pass" placeholder="Contraseña">
            <button class="btn-main" onclick="autenticar()">INGRESAR</button>
        </div>
    </div>

    <nav id="sidebar">
        <h2 style="color: var(--acento)">🛰️ ERP CLOUD</h2>
        <div class="menu-item active" onclick="ver('dash')">🏠 Dashboard</div>
        <div class="menu-item" onclick="ver('inv')">📦 Inventario</div>
        <div class="menu-item" onclick="ver('pos')">💸 Caja Registradora</div>
        <div style="margin-top: auto;">
            <div class="menu-item" onclick="location.reload()" style="color:var(--rojo)">🔒 Salir</div>
        </div>
    </nav>

    <main id="content">
        <section id="dash" class="section active">
            <h1>Resumen de Operaciones</h1>
            <div class="grid-kpi">
                <div class="card"><h3>Ventas Hoy</h3><div class="val" id="kToday">$0</div></div>
                <div class="card"><h3>Ganancia</h3><div class="val" id="kProfit">$0</div></div>
                <div class="card"><h3>IVA (19%)</h3><div class="val" id="kTax">$0</div></div>
                <div class="card"><h3>Items Stock</h3><div class="val" id="kStock">0</div></div>
            </div>
            <div class="card" style="height: 300px;">
                <canvas id="myChart"></canvas>
            </div>
        </section>

        <section id="inv" class="section">
            <h1>Control de Mercancía</h1>
            <div class="card">
                <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;">
                    <input type="text" id="sku" placeholder="Código">
                    <input type="text" id="nom" placeholder="Producto">
                    <input type="number" id="cos" placeholder="Costo">
                    <input type="number" id="pre" placeholder="Precio">
                    <input type="number" id="sto" placeholder="Stock">
                </div>
                <button class="btn-main" onclick="guardarProducto()">SINCRONIZAR A LA NUBE</button>
            </div>
            <div class="card">
                <table>
                    <thead><tr><th>SKU</th><th>Producto</th><th>Venta</th><th>Stock</th></tr></thead>
                    <tbody id="listaInv"></tbody>
                </table>
            </div>
        </section>

        <section id="pos" class="section">
            <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px;">
                <div class="card">
                    <h2>Terminal de Venta</h2>
                    <input type="text" id="scanner" placeholder="ESCANEE CÓDIGO..." style="font-size: 1.5rem;">
                    <table id="cartTable">
                        <thead><tr><th>Producto</th><th>Precio</th><th>Acción</th></tr></thead>
                        <tbody id="listaCarrito"></tbody>
                    </table>
                </div>
                <div class="card" style="text-align: right;">
                    <h3>TOTAL A PAGAR</h3>
                    <div style="font-size: 4rem; color: var(--acento); font-weight: bold;">$<span id="totalPos">0</span></div>
                    <button class="btn-sell" onclick="finalizarVenta()">FINALIZAR VENTA</button>
                    <button style="background:#334155; color:white; margin-top:10px" onclick="window.print()">IMPRIMIR TICKET</button>
                </div>
            </div>
        </section>
    </main>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "TU_API_KEY",
        authDomain: "tu-proyecto.firebaseapp.com",
        projectId: "tu-proyecto",
        storageBucket: "tu-proyecto.appspot.com",
        messagingSenderId: "tu-id",
        appId: "tu-app-id"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let userLog = "";
    let localInv = [];
    let carrito = [];

    function autenticar() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if(u.startsWith('user') && p === "GB2026") {
            userLog = u;
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            syncCloud();
        } else { alert("Error de acceso"); }
    }

    function ver(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function syncCloud() {
        db.collection("inventario").onSnapshot(snap => {
            localInv = snap.docs.map(d => d.data());
            renderInv();
            updateDash();
        });
        db.collection("ventas").onSnapshot(() => updateDash());
    }

    async function guardarProducto() {
        const sku = document.getElementById('sku').value;
        const data = {
            sku: sku,
            nombre: document.getElementById('nom').value.toUpperCase(),
            costo: parseFloat(document.getElementById('cos').value),
            precio: parseFloat(document.getElementById('pre').value),
            stock: parseInt(document.getElementById('sto').value)
        };
        await db.collection("inventario").doc(sku).set(data);
        alert("Sincronizado");
    }

    document.getElementById('scanner').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') {
            const p = localInv.find(x => x.sku === e.target.value);
            if(p && p.stock > 0) {
                carrito.push(p);
                renderCart();
            }
            e.target.value = '';
        }
    });

    async function finalizarVenta() {
        if(carrito.length === 0) return;
        try {
            const t = carrito.reduce((a,b) => a+b.precio, 0);
            const g = t - carrito.reduce((a,b) => a+b.costo, 0);

            for(let item of carrito) {
                await db.collection("inventario").doc(item.sku).update({
                    stock: firebase.firestore.FieldValue.increment(-1)
                });
            }

            await db.collection("ventas").add({
                fecha: new Date(),
                total: t,
                ganancia: g,
                user: userLog
            });

            alert("Venta Exitosa ✅");
            carrito = [];
            renderCart();
        } catch(e) { alert("Error: Revisa las Reglas de Firebase"); }
    }

    function renderInv() {
        document.getElementById('listaInv').innerHTML = localInv.map(p => `
            <tr><td>${p.sku}</td><td>${p.nombre}</td><td>$${p.precio}</td><td>${p.stock}</td></tr>
        `).join('');
    }

    function renderCart() {
        const t = carrito.reduce((a,b) => a+b.precio, 0);
        document.getElementById('totalPos').innerText = t.toLocaleString();
        document.getElementById('listaCarrito').innerHTML = carrito.map((c, i) => `
            <tr><td>${c.nombre}</td><td>$${c.precio}</td><td onclick="carrito.splice(${i},1);renderCart()" style="color:red;cursor:pointer">X</td></tr>
        `).join('');
    }

    async function updateDash() {
        const v = await db.collection("ventas").get();
        const sales = v.docs.map(d => d.data());
        const total = sales.reduce((a,b) => a+b.total, 0);
        document.getElementById('kToday').innerText = "$" + total.toLocaleString();
        document.getElementById('kProfit').innerText = "$" + sales.reduce((a,b)=>a+b.ganancia, 0).toLocaleString();
        document.getElementById('kTax').innerText = "$" + (total * 0.19).toLocaleString();
        document.getElementById('kStock').innerText = localInv.length;
    }
</script>
</body>
</html>
